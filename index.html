<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AC Publisher</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap');
  :root{--navy:#0d1b2a;--charcoal:#1a2535;--copper:#b87333;--gold:#c9a84c;--cream:#f5f0e8;--muted:#8a8f9a;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--navy);color:var(--cream);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:2rem;background-image:radial-gradient(ellipse at 20% 20%,rgba(184,115,51,.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(201,168,76,.05) 0%,transparent 50%);}
  .container{width:100%;max-width:760px;animation:fadeUp .6s ease both;padding-top:1rem;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  .header{margin-bottom:2rem;display:flex;align-items:flex-end;justify-content:space-between;}
  .logo-eyebrow{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.2em;color:var(--copper);text-transform:uppercase;}
  .logo-title{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:700;color:var(--cream);}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--copper);box-shadow:0 0 10px var(--copper);animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
  .card{background:var(--charcoal);border:1px solid rgba(184,115,51,.15);border-radius:16px;padding:1.75rem;margin-bottom:1rem;position:relative;overflow:hidden;}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--copper),transparent);opacity:.5;}
  .field-label{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--copper);margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem;}
  .field-label::after{content:'';flex:1;height:1px;background:rgba(184,115,51,.2);}
  input[type=text],input[type=password],textarea{width:100%;background:rgba(13,27,42,.6);border:1px solid rgba(184,115,51,.12);border-radius:10px;color:var(--cream);font-family:'DM Sans',sans-serif;font-size:.88rem;padding:.75rem 1rem;outline:none;transition:border-color .2s,box-shadow .2s;}
  input::placeholder,textarea::placeholder{color:var(--muted);}
  input:focus,textarea:focus{border-color:rgba(184,115,51,.4);box-shadow:0 0 0 3px rgba(184,115,51,.06);}
  textarea{line-height:1.7;resize:vertical;}
  .counter{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);text-align:right;margin-top:.4rem;}
  .counter.warn{color:var(--gold);}
  .row{display:flex;gap:.75rem;align-items:center;}
  .btn-sm{background:transparent;border:1px solid rgba(184,115,51,.3);color:var(--copper);font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.1em;padding:.75rem 1rem;border-radius:8px;cursor:pointer;white-space:nowrap;transition:all .2s;}
  .btn-sm:hover{background:rgba(184,115,51,.1);border-color:var(--copper);}
  .image-prompt-area{margin-bottom:1rem;}
  .image-prompt-input{width:100%;background:rgba(13,27,42,.6);border:1px solid rgba(184,115,51,.12);border-radius:10px;color:var(--cream);font-family:'DM Sans',sans-serif;font-size:.85rem;padding:.75rem 1rem;outline:none;resize:vertical;min-height:80px;line-height:1.6;transition:border-color .2s,box-shadow .2s;}
  .image-prompt-input::placeholder{color:var(--muted);}
  .image-prompt-input:focus{border-color:rgba(184,115,51,.4);box-shadow:0 0 0 3px rgba(184,115,51,.06);}
  .prompt-hint{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--muted);margin-top:.4rem;line-height:1.5;}
  .model-toggle{display:flex;gap:.5rem;margin-bottom:1rem;}
  .model-btn{flex:1;background:rgba(13,27,42,.6);border:1px solid rgba(184,115,51,.12);color:var(--muted);font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.08em;padding:.6rem;border-radius:8px;cursor:pointer;transition:all .2s;text-align:center;}
  .model-btn.active{background:rgba(184,115,51,.15);border-color:var(--copper);color:var(--copper);}
  .btn-generate{width:100%;background:rgba(184,115,51,.12);border:1px solid rgba(184,115,51,.3);color:var(--copper);font-family:'DM Sans',sans-serif;font-weight:500;font-size:.88rem;padding:.85rem 1.5rem;border-radius:10px;cursor:pointer;transition:all .2s;margin-bottom:.75rem;}
  .btn-generate:hover{background:rgba(184,115,51,.2);}
  .btn-generate:disabled{opacity:.4;cursor:not-allowed;}
  .image-preview{width:100%;border-radius:10px;overflow:hidden;background:rgba(13,27,42,.6);border:1px dashed rgba(184,115,51,.15);min-height:140px;display:flex;align-items:center;justify-content:center;}
  .image-preview img{width:100%;border-radius:10px;display:block;}
  .image-placeholder{text-align:center;color:var(--muted);font-size:.85rem;padding:2rem;}
  .image-placeholder .icon{font-size:2rem;margin-bottom:.5rem;opacity:.4;display:block;}
  .image-status{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted);margin-top:.5rem;text-align:center;min-height:1.2rem;}
  .publish-row{display:flex;gap:.75rem;}
  .btn-clear{background:transparent;border:1px solid rgba(255,255,255,.08);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:.85rem;padding:.85rem 1.25rem;border-radius:10px;cursor:pointer;transition:all .2s;}
  .btn-clear:hover{border-color:rgba(255,255,255,.15);color:var(--cream);}
  .btn-publish{flex:1;background:linear-gradient(135deg,var(--copper),var(--gold));border:none;color:var(--navy);font-family:'DM Sans',sans-serif;font-weight:500;font-size:.95rem;padding:.95rem 2rem;border-radius:10px;cursor:pointer;transition:all .2s;}
  .btn-publish:active{transform:scale(.98);}
  .btn-publish:disabled{opacity:.4;cursor:not-allowed;}
  .settings-toggle{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.1em;color:var(--muted);cursor:pointer;background:none;border:none;text-transform:uppercase;text-align:center;width:100%;padding:.75rem;transition:color .2s;display:block;}
  .settings-toggle:hover{color:var(--copper);}
  .settings-panel{display:none;}
  .settings-panel.open{display:block;animation:fadeUp .3s ease;}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(13,27,42,.3);border-top-color:var(--navy);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px;}
  .spinner-copper{border-color:rgba(184,115,51,.2);border-top-color:var(--copper);}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(80px);background:var(--charcoal);border:1px solid rgba(184,115,51,.3);border-radius:10px;padding:.85rem 1.5rem;font-size:.85rem;display:flex;align-items:center;gap:.75rem;transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .3s;opacity:0;pointer-events:none;z-index:100;white-space:nowrap;}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
  .toast.success{border-color:rgba(45,106,79,.5);}
  .toast.error{border-color:rgba(180,60,60,.5);}
  .divider{height:1px;background:rgba(184,115,51,.1);margin:1rem 0;}
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <div class="logo-eyebrow">Automation Champions</div>
      <div class="logo-title">LinkedIn Publisher</div>
    </div>
    <div class="status-dot"></div>
  </div>

  <!-- POST -->
  <div class="card">
    <div class="field-label">Post Content</div>
    <textarea id="postContent" style="min-height:220px;" placeholder="Paste your LinkedIn post from Gemini here..." oninput="updateCounter()"></textarea>
    <div class="counter" id="counter">0 characters</div>
  </div>

  <!-- IMAGE -->
  <div class="card">
    <div class="field-label">Image — AI Generated</div>

    <!-- Model selector -->
    <div class="model-toggle">
      <button class="model-btn active" id="btnDalle" onclick="setModel('dall-e-3')">DALL·E 3 HD</button>
      <button class="model-btn" id="btnGpt" onclick="setModel('gpt-image-1')">GPT Image 1 ✦</button>
    </div>

    <!-- Custom prompt -->
    <div class="image-prompt-area">
      <div class="field-label">Image Description</div>
      <textarea class="image-prompt-input" id="imagePrompt"
        placeholder="Describe your image — e.g. 'Luxury watch on desk, Canary Wharf background, golden light, moody cinematic, navy and copper tones, no people'"></textarea>
      <div class="prompt-hint">Leave blank to auto-generate from post content · Be specific for better results</div>
    </div>

    <div class="row" style="margin-bottom:.75rem;">
      <button class="btn-generate" id="genBtn" onclick="generateImage()" style="margin-bottom:0;">✦ Generate Image</button>
      <button class="btn-sm" onclick="clearImage()">Clear</button>
    </div>

    <div class="image-preview" id="imagePreview">
      <div class="image-placeholder">
        <span class="icon">🖼</span>
        Image will appear here
      </div>
    </div>
    <div class="image-status" id="imageStatus"></div>
  </div>

  <!-- PUBLISH -->
  <div class="card">
    <div class="publish-row">
      <button class="btn-clear" onclick="clearAll()">Clear All</button>
      <button class="btn-publish" id="publishBtn" onclick="publish()">Publish to LinkedIn →</button>
    </div>
  </div>

  <button class="settings-toggle" onclick="toggleSettings()">⚙ Settings</button>

  <div class="settings-panel" id="settingsPanel">
    <div class="card">
      <div class="field-label">OpenAI API Key — for image generation</div>
      <input type="password" id="openaiKey" placeholder="sk-..." style="margin-bottom:1.25rem;">
      <div class="field-label">Make.com Webhook URL</div>
      <div class="row">
        <input type="text" id="webhookUrl" placeholder="https://hook.eu2.make.com/...">
        <button class="btn-sm" onclick="saveSettings()">Save</button>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast">
  <span id="toastIcon">✓</span>
  <span id="toastMsg">Done</span>
</div>

<script>
  // Load saved
  const oKey = localStorage.getItem('ac_openai_key');
  const wUrl = localStorage.getItem('ac_webhook');
  if (oKey) document.getElementById('openaiKey').value = oKey;
  if (wUrl) document.getElementById('webhookUrl').value = wUrl;

  let generatedImageUrl = null;
  let currentModel = 'dall-e-3';

  function setModel(m) {
    currentModel = m;
    document.getElementById('btnDalle').classList.toggle('active', m === 'dall-e-3');
    document.getElementById('btnGpt').classList.toggle('active', m === 'gpt-image-1');
  }

  function saveSettings() {
    const key = document.getElementById('openaiKey').value.trim();
    const url = document.getElementById('webhookUrl').value.trim();
    if (key) localStorage.setItem('ac_openai_key', key);
    if (url) localStorage.setItem('ac_webhook', url);
    showToast('✓', 'Settings saved', 'success');
  }

  function toggleSettings() {
    document.getElementById('settingsPanel').classList.toggle('open');
  }

  function updateCounter() {
    const len = document.getElementById('postContent').value.length;
    const el = document.getElementById('counter');
    el.textContent = len.toLocaleString() + ' characters';
    el.className = 'counter' + (len > 2800 ? ' warn' : '');
  }

  function clearImage() {
    generatedImageUrl = null;
    document.getElementById('imagePreview').innerHTML = '<div class="image-placeholder"><span class="icon">🖼</span>Image will appear here</div>';
    document.getElementById('imageStatus').textContent = '';
  }

  function clearAll() {
    document.getElementById('postContent').value = '';
    document.getElementById('imagePrompt').value = '';
    updateCounter();
    clearImage();
  }

  async function generateImage() {
    const content = document.getElementById('postContent').value.trim();
    const customPrompt = document.getElementById('imagePrompt').value.trim();
    const apiKey = document.getElementById('openaiKey').value.trim();

    if (!apiKey) { showToast('⚠', 'Add OpenAI API key in Settings', 'error'); document.getElementById('settingsPanel').classList.add('open'); return; }
    if (!content && !customPrompt) { showToast('⚠', 'Add post content or image description', 'error'); return; }

    const btn = document.getElementById('genBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner spinner-copper"></span>Generating...';
    document.getElementById('imageStatus').textContent = 'Generating with ' + (currentModel === 'gpt-image-1' ? 'GPT Image 1' : 'DALL·E 3 HD') + '...';

    // Build prompt
    let prompt;
    if (customPrompt) {
      // Use custom prompt as-is, add quality modifiers
      prompt = customPrompt + '. High-end corporate photography style. Photorealistic. Professional quality. No distorted faces or hands.';
    } else {
      // Auto-generate from post
      const snippet = content.substring(0, 200).replace(/"/g, "'");
      prompt = `High-end corporate photography. Cinematic lighting, sharp focus, minimalist. Luxury London office (Canary Wharf or The City), floor-to-ceiling windows, blurred Shard or Gherkin skyline. Metaphorical visual for: "${snippet}". Deep navy, charcoal, copper and gold. Wide shot, clean desk, luxury watch, fountain pen, slim laptop. Photorealistic. No cartoons. No distorted faces or hands.`;
    }

    try {
      let body;
      if (currentModel === 'gpt-image-1') {
        body = { model: 'gpt-image-1', prompt, n: 1, size: '1024x1024', quality: 'high' };
      } else {
        body = { model: 'dall-e-3', prompt, n: 1, size: '1792x1024', quality: 'hd', response_format: 'url' };
      }

      const res = await fetch('https://api.openai.com/v1/images/generations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
        body: JSON.stringify(body)
      });

      const data = await res.json();
      if (data.error) throw new Error(data.error.message);

      // Handle both url and b64_json responses
      if (data.data[0].url) {
        generatedImageUrl = data.data[0].url;
        document.getElementById('imagePreview').innerHTML = '<img src="' + generatedImageUrl + '" alt="Generated">';
      } else if (data.data[0].b64_json) {
        const b64 = data.data[0].b64_json;
        generatedImageUrl = 'data:image/png;base64,' + b64;
        document.getElementById('imagePreview').innerHTML = '<img src="' + generatedImageUrl + '" alt="Generated">';
      }

      document.getElementById('imageStatus').textContent = '✓ Image ready';
      showToast('✓', 'Image generated!', 'success');

    } catch (err) {
      document.getElementById('imageStatus').textContent = '✗ ' + err.message;
      showToast('✗', 'Generation failed: ' + err.message.substring(0, 50), 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '✦ Generate Image';
    }
  }

  async function publish() {
    const content = document.getElementById('postContent').value.trim();
    const webhookUrl = document.getElementById('webhookUrl').value.trim();

    if (!webhookUrl) { showToast('⚠', 'Add webhook URL in Settings', 'error'); document.getElementById('settingsPanel').classList.add('open'); return; }
    if (!content) { showToast('⚠', 'Paste your post content first', 'error'); return; }

    const btn = document.getElementById('publishBtn');
    btn.disabled = true;
    btn.textContent = 'Sending...';

    try {
      await fetch(webhookUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        mode: 'no-cors',
        body: JSON.stringify({
          content,
          image_url: (generatedImageUrl && !generatedImageUrl.startsWith('data:')) ? generatedImageUrl : null,
          has_image: !!(generatedImageUrl && !generatedImageUrl.startsWith('data:')),
          source: 'AC Publisher',
          timestamp: new Date().toISOString()
        })
      });

      showToast('✓', 'Sent to Make.com — going live!', 'success');
      setTimeout(() => clearAll(), 2000);

    } catch (err) {
      showToast('✗', 'Failed. Check webhook URL.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Publish to LinkedIn →';
    }
  }

  function showToast(icon, msg, type) {
    const t = document.getElementById('toast');
    document.getElementById('toastIcon').textContent = icon;
    document.getElementById('toastMsg').textContent = msg;
    t.className = 'toast ' + type + ' show';
    setTimeout(() => t.className = 'toast ' + type, 3200);
  }
</script>
</body>
</html>
